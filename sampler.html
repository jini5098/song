<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>손맛 샘플러</title>
<style>
  :root{
    --bg:#232021;
    --panel:#2d2a2b;
    --panel2:#383435;
    --ink:#f2ebe0;
    --ink-dim:#a89f94;
    --line:#141213;
    --rec:#c15a4a;
    --play:#6f9a68;
    --accent:#d9a441;
    --shadow: 0 2px 0 #141213;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
    display:flex; flex-direction:column;
    height:100dvh; height:100vh;
    touch-action:manipulation;
    user-select:none; -webkit-user-select:none;
    position:relative;
  }
  /* 종이질감 오버레이 */
  #grain{
    position:fixed; inset:0; z-index:9999; pointer-events:none;
    opacity:.05; mix-blend-mode:overlay;
  }
  .wrap{ display:flex; flex-direction:column; height:100%; padding:10px 10px calc(10px + env(safe-area-inset-bottom)); gap:8px; max-width:560px; margin:0 auto; width:100%; }

  /* 상단 헤더 */
  header{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .logo{ display:flex; align-items:center; gap:8px; }
  .logo .dot{ width:16px; height:16px; background:var(--accent); border:2px solid var(--line); border-radius:3px; transform:rotate(-4deg); }
  .logo .dot.b{ background:var(--rec); margin-left:-10px; transform:rotate(5deg); }
  .logo h1{ font-size:17px; margin:0; letter-spacing:-.5px; }
  .kitname{ font-size:12px; color:var(--ink-dim); }

  /* 컨트롤 패널 */
  .panel{ background:var(--panel); border:2px solid var(--line); border-radius:8px; box-shadow:var(--shadow); padding:8px; }

  .transport{ display:flex; gap:6px; }
  .btn{
    flex:1; border:2px solid var(--line); border-radius:7px;
    background:var(--panel2); color:var(--ink);
    font-family:inherit; font-size:13px; font-weight:700;
    padding:9px 4px; cursor:pointer; box-shadow:var(--shadow);
    transition:transform .04s, filter .08s; display:flex; align-items:center; justify-content:center; gap:5px;
  }
  .btn:active{ transform:translateY(2px); box-shadow:none; }
  .btn .ic{ width:12px; height:12px; display:inline-block; }
  .btn.rec.on{ background:var(--rec); animation:blink 1s steps(2,start) infinite; }
  .btn.play.on{ background:var(--play); }
  @keyframes blink{ 50%{ filter:brightness(.6); } }

  .sliders{ display:flex; gap:12px; margin-top:8px; align-items:center; flex-wrap:wrap; }
  .sl{ flex:1; min-width:120px; }
  .sl label{ display:flex; justify-content:space-between; font-size:11px; color:var(--ink-dim); margin-bottom:3px; }
  .sl label b{ color:var(--ink); font-weight:700; }
  input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:8px; background:var(--panel2); border:2px solid var(--line); border-radius:6px; outline:none; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:20px; height:20px; background:var(--accent); border:2px solid var(--line); border-radius:4px; cursor:pointer; box-shadow:var(--shadow); }
  input[type=range]::-moz-range-thumb{ width:20px; height:20px; background:var(--accent); border:2px solid var(--line); border-radius:4px; cursor:pointer; }

  .kits{ display:flex; gap:6px; margin-top:8px; }
  .kitbtn{ flex:1; border:2px solid var(--line); border-radius:7px; background:var(--panel2); color:var(--ink-dim); font-family:inherit; font-size:12px; font-weight:700; padding:7px; cursor:pointer; box-shadow:var(--shadow); }
  .kitbtn:active{ transform:translateY(2px); box-shadow:none; }
  .kitbtn.on{ background:var(--accent); color:var(--line); }

  /* 스텝 표시줄 */
  .steps{ display:grid; grid-template-columns:repeat(16,1fr); gap:3px; }
  .step{ height:7px; background:var(--panel2); border:1px solid var(--line); border-radius:2px; }
  .step.beat{ background:#443e3f; }
  .step.cur{ background:var(--accent); }

  /* 패드 그리드 */
  .pads{ flex:1; display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(4,1fr); gap:8px; min-height:0; }
  .pad{
    position:relative; border:2px solid var(--line); border-radius:10px;
    box-shadow:0 3px 0 var(--line);
    display:flex; align-items:flex-end; justify-content:flex-start;
    padding:8px; cursor:pointer; overflow:hidden;
    transition:transform .05s, filter .05s;
  }
  .pad .lbl{ font-size:12px; font-weight:800; color:rgba(20,18,19,.72); letter-spacing:-.3px; line-height:1.05; text-align:left; }
  /* 패드 위 작은 도형들(도형 조합 장식) */
  .pad .shp{ position:absolute; border:2px solid rgba(20,18,19,.35); }
  .pad .s1{ width:14px; height:14px; border-radius:50%; top:9px; left:9px; }
  .pad .s2{ width:12px; height:12px; top:10px; right:10px; transform:rotate(8deg); }
  .pad.hit{ transform:translateY(3px); box-shadow:none; filter:brightness(1.25) saturate(1.1); }
  .pad.seqflash{ filter:brightness(1.22); }

  footer{ font-size:10.5px; color:var(--ink-dim); text-align:center; line-height:1.4; }
</style>
</head>
<body>
<svg id="grain"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>

<div class="wrap">
  <header>
    <div class="logo">
      <span class="dot"></span><span class="dot b"></span>
      <h1>손맛 샘플러</h1>
    </div>
    <div class="kitname" id="kitLabel">드럼킷</div>
  </header>

  <div class="panel">
    <div class="transport">
      <button class="btn rec" id="btnRec"><span>●</span> 녹음</button>
      <button class="btn play" id="btnPlay"><span>▶</span> 재생</button>
      <button class="btn" id="btnClear"><span>✕</span> 클리어</button>
    </div>
    <div class="sliders">
      <div class="sl">
        <label>템포 <b><span id="bpmVal">120</span> BPM</b></label>
        <input type="range" id="bpm" min="60" max="180" value="120" step="1">
      </div>
      <div class="sl">
        <label>마스터 볼륨 <b><span id="volVal">80</span></b></label>
        <input type="range" id="vol" min="0" max="100" value="80" step="1">
      </div>
    </div>
    <div class="kits">
      <button class="kitbtn on" data-kit="0">드럼킷</button>
      <button class="kitbtn" data-kit="1">멜로딕</button>
    </div>
    <div class="steps" id="steps" style="margin-top:8px;"></div>
  </div>

  <div class="pads" id="pads"></div>

  <footer>첫 터치에 소리가 깨어나요 · 여러 패드를 동시에 눌러보세요 · 녹음 누르고 두드리면 루프로 반복돼요</footer>
</div>

<script>
(function(){
  "use strict";

  /* ================= 오디오 엔진 ================= */
  let AC = null, master = null, noiseBuf = null;

  function ensureAudio(){
    if(AC) { if(AC.state === "suspended") AC.resume(); return; }
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain();
    master.gain.value = 0.8;
    master.connect(AC.destination);
    // 노이즈 버퍼 1회 생성
    const len = AC.sampleRate * 1.2;
    noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    if(AC.state === "suspended") AC.resume();
  }

  function noiseSource(){
    const s = AC.createBufferSource();
    s.buffer = noiseBuf;
    return s;
  }
  function env(g, t, a, peak, d){
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  }

  /* ---- 개별 드럼 신스 ---- */
  function kick(t, g){
    const o = AC.createOscillator(), amp = AC.createGain();
    o.type="sine";
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(50, t+0.11);
    env(amp, t, 0.002, g, 0.42);
    o.connect(amp); amp.connect(master);
    o.start(t); o.stop(t+0.5);
  }
  function tom(t, base, g){
    const o = AC.createOscillator(), amp = AC.createGain();
    o.type="sine";
    o.frequency.setValueAtTime(base, t);
    o.frequency.exponentialRampToValueAtTime(base*0.5, t+0.18);
    env(amp, t, 0.002, g, 0.3);
    o.connect(amp); amp.connect(master);
    o.start(t); o.stop(t+0.4);
  }
  function snare(t, g){
    // 노이즈
    const n = noiseSource(), nf = AC.createBiquadFilter(), ng = AC.createGain();
    nf.type="highpass"; nf.frequency.value=1500;
    env(ng, t, 0.002, g*0.9, 0.18);
    n.connect(nf); nf.connect(ng); ng.connect(master);
    n.start(t); n.stop(t+0.25);
    // 바디 톤
    const o = AC.createOscillator(), og = AC.createGain();
    o.type="triangle"; o.frequency.setValueAtTime(190, t);
    o.frequency.exponentialRampToValueAtTime(150, t+0.1);
    env(og, t, 0.002, g*0.5, 0.12);
    o.connect(og); og.connect(master);
    o.start(t); o.stop(t+0.2);
  }
  function hat(t, g, open){
    const n = noiseSource(), f = AC.createBiquadFilter(), amp = AC.createGain();
    f.type="highpass"; f.frequency.value=7000;
    const dec = open ? 0.32 : 0.05;
    env(amp, t, 0.001, g*0.6, dec);
    n.connect(f); f.connect(amp); amp.connect(master);
    n.start(t); n.stop(t + dec + 0.1);
  }
  function clap(t, g){
    const f = AC.createBiquadFilter(); f.type="bandpass"; f.frequency.value=1200; f.Q.value=1.2;
    const out = AC.createGain(); out.connect(master); f.connect(out);
    const offs=[0,0.012,0.024,0.04];
    offs.forEach((o,i)=>{
      const n = noiseSource(), ng = AC.createGain();
      const peak = i===offs.length-1 ? g*0.8 : g*0.5;
      env(ng, t+o, 0.001, peak, i===offs.length-1?0.14:0.03);
      n.connect(ng); ng.connect(f);
      n.start(t+o); n.stop(t+o+0.2);
    });
  }
  function rim(t, g){
    const o = AC.createOscillator(), amp = AC.createGain();
    o.type="square"; o.frequency.value=440;
    env(amp, t, 0.001, g*0.5, 0.03);
    const f = AC.createBiquadFilter(); f.type="highpass"; f.frequency.value=800;
    o.connect(f); f.connect(amp); amp.connect(master);
    o.start(t); o.stop(t+0.06);
  }
  function cowbell(t, g){
    const o1=AC.createOscillator(), o2=AC.createOscillator(), amp=AC.createGain();
    o1.type="square"; o2.type="square";
    o1.frequency.value=560; o2.frequency.value=845;
    const f=AC.createBiquadFilter(); f.type="bandpass"; f.frequency.value=800; f.Q.value=1.5;
    env(amp, t, 0.002, g*0.5, 0.24);
    o1.connect(f); o2.connect(f); f.connect(amp); amp.connect(master);
    o1.start(t); o2.start(t); o1.stop(t+0.3); o2.stop(t+0.3);
  }
  function perc(t, g){
    const o=AC.createOscillator(), amp=AC.createGain();
    o.type="sine"; o.frequency.setValueAtTime(900,t);
    o.frequency.exponentialRampToValueAtTime(400,t+0.08);
    env(amp,t,0.001,g*0.6,0.1);
    o.connect(amp); amp.connect(master);
    o.start(t); o.stop(t+0.2);
  }
  // 멜로딕: 벨(여러 사인 조합) / 신스(saw+필터)
  function bell(t, freq, g){
    const parts=[1,2.0,3.01,4.2];
    const gains=[1,0.5,0.32,0.18];
    const out=AC.createGain(); out.connect(master);
    env(out, t, 0.003, g*0.45, 0.9);
    parts.forEach((p,i)=>{
      const o=AC.createOscillator(), og=AC.createGain();
      o.type="sine"; o.frequency.value=freq*p;
      og.gain.value=gains[i];
      o.connect(og); og.connect(out);
      o.start(t); o.stop(t+1.0);
    });
  }
  function synth(t, freq, g){
    const o=AC.createOscillator(), amp=AC.createGain(), f=AC.createBiquadFilter();
    o.type="sawtooth"; o.frequency.value=freq;
    f.type="lowpass"; f.frequency.setValueAtTime(freq*8, t);
    f.frequency.exponentialRampToValueAtTime(freq*2, t+0.25);
    f.Q.value=4;
    env(amp, t, 0.004, g*0.4, 0.4);
    o.connect(f); f.connect(amp); amp.connect(master);
    o.start(t); o.stop(t+0.7);
  }

  /* ================= 킷 정의 ================= */
  // color: 플랫 솔리드(뮤트 레트로), play(t,gain)
  const KITS = [
    { name:"드럼킷", pads:[
      {lbl:"킥",      c:"#c15a4a", f:(t,g)=>kick(t,g)},
      {lbl:"스네어",  c:"#d9a441", f:(t,g)=>snare(t,g)},
      {lbl:"클랩",    c:"#cf7b4e", f:(t,g)=>clap(t,g)},
      {lbl:"오픈햇",  c:"#7fae9b", f:(t,g)=>hat(t,g,true)},

      {lbl:"클로즈햇",c:"#6f9a68", f:(t,g)=>hat(t,g,false)},
      {lbl:"톰 로우", c:"#8c6e8f", f:(t,g)=>tom(t,110,g)},
      {lbl:"톰 미드", c:"#a07a8f", f:(t,g)=>tom(t,165,g)},
      {lbl:"톰 하이", c:"#b58aa0", f:(t,g)=>tom(t,220,g)},

      {lbl:"림샷",    c:"#88a2b8", f:(t,g)=>rim(t,g)},
      {lbl:"카우벨",  c:"#d6b24a", f:(t,g)=>cowbell(t,g)},
      {lbl:"퍼크",    c:"#bf6b57", f:(t,g)=>perc(t,g)},
      {lbl:"샤커",    c:"#9fae6a", f:(t,g)=>hat(t,g*0.7,false)},

      {lbl:"서브킥",  c:"#a24c3e", f:(t,g)=>kick(t,g*1.1)},
      {lbl:"스네어2", c:"#c9994a", f:(t,g)=>{snare(t,g); }},
      {lbl:"벨",      c:"#6d97a8", f:(t,g)=>bell(t,880,g*0.8)},
      {lbl:"신스",    c:"#7e8bb0", f:(t,g)=>synth(t,220,g)},
    ]},
    { name:"멜로딕", pads:(function(){
        // C 메이저 펜타토닉 느낌 음계 벨/신스 혼합
        const sc=[261.63,293.66,329.63,392.0,440.0,523.25,587.33,659.25];
        const cols=["#c15a4a","#cf7b4e","#d9a441","#9fae6a","#6f9a68","#7fae9b","#6d97a8","#7e8bb0"];
        const names=["도","레","미","솔","라","도↑","레↑","미↑"];
        const out=[];
        for(let i=0;i<8;i++) out.push({lbl:"벨 "+names[i], c:cols[i], f:((fr)=>(t,g)=>bell(t,fr,g))(sc[i])});
        for(let i=0;i<8;i++) out.push({lbl:"신스 "+names[i], c:cols[i], f:((fr)=>(t,g)=>synth(t,fr,g))(sc[i])});
        return out;
      })()
    }
  ];

  /* ================= UI 빌드 ================= */
  let curKit = 0;
  const padsEl = document.getElementById("pads");
  const stepsEl = document.getElementById("steps");
  const padNodes = [];

  function buildPads(){
    padsEl.innerHTML=""; padNodes.length=0;
    KITS[curKit].pads.forEach((p,i)=>{
      const el=document.createElement("div");
      el.className="pad"; el.style.background=p.c;
      el.innerHTML='<span class="shp s1"></span><span class="shp s2"></span><span class="lbl">'+p.lbl+'</span>';
      el.dataset.idx=i;
      padsEl.appendChild(el);
      padNodes.push(el);
    });
  }
  buildPads();

  // 스텝 표시
  const STEPS=16;
  const stepNodes=[];
  for(let i=0;i<STEPS;i++){
    const s=document.createElement("div");
    s.className="step"+((i%4===0)?" beat":"");
    stepsEl.appendChild(s); stepNodes.push(s);
  }

  /* ================= 패드 트리거 + 멀티터치 ================= */
  function flash(el){
    el.classList.add("hit");
    setTimeout(()=>el.classList.remove("hit"),110);
  }
  const masterVol = ()=> parseInt(document.getElementById("vol").value,10)/100;

  function hitPad(idx, record){
    ensureAudio();
    const g = 0.9; // 개별 신스 내부에서 상대 조절, 마스터로 전체
    try{ KITS[curKit].pads[idx].f(AC.currentTime+0.001, g); }catch(e){ /* noop */ }
    flash(padNodes[idx]);
    if(record && recording) recordHit(idx);
  }

  // pointerdown 으로 즉시 발음 (멀티터치: 각 포인터가 개별 이벤트)
  padsEl.addEventListener("pointerdown", (e)=>{
    const t = e.target.closest(".pad");
    if(!t) return;
    e.preventDefault();
    hitPad(parseInt(t.dataset.idx,10), true);
  }, {passive:false});

  // 터치 폴백(일부 환경에서 멀티터치 신뢰성)
  padsEl.addEventListener("touchstart", (e)=>{
    // pointer 이벤트가 동작하면 중복 방지
    if(window.PointerEvent) return;
    e.preventDefault();
    for(const touch of e.changedTouches){
      const el=document.elementFromPoint(touch.clientX, touch.clientY);
      const pad=el && el.closest(".pad");
      if(pad) hitPad(parseInt(pad.dataset.idx,10), true);
    }
  }, {passive:false});

  /* ================= 시퀀서 / 루프 ================= */
  let recording=false, playing=false;
  // pattern[step] = Set of padIdx  (킷별로 분리)
  let pattern = KITS.map(()=> Array.from({length:STEPS},()=>new Set()));
  let bpm = 120;
  let currentStep = 0;
  let nextStepTime = 0;
  let schedTimer = null;
  let loopStartTime = 0;

  function stepDur(){ return (60/bpm)/4; } // 16분음표

  function recordHit(idx){
    // 현재 시간 기준 가장 가까운 스텝에 양자화
    if(!playing){ // 녹음만 눌렀고 재생 안했으면 재생도 시작
      startPlay();
    }
    const elapsed = AC.currentTime - loopStartTime;
    let st = Math.round(elapsed / stepDur()) % STEPS;
    if(st<0) st+=STEPS;
    pattern[curKit][st].add(idx);
  }

  const LOOKAHEAD = 0.1;   // 초
  const INTERVAL = 25;     // ms

  function scheduler(){
    while(nextStepTime < AC.currentTime + LOOKAHEAD){
      scheduleStep(currentStep, nextStepTime);
      nextStepTime += stepDur();
      currentStep = (currentStep+1)%STEPS;
      if(currentStep===0) loopStartTime = nextStepTime; // 새 루프 시작 기준 갱신
    }
  }
  function scheduleStep(step, time){
    const set = pattern[curKit][step];
    set.forEach(idx=>{
      try{ KITS[curKit].pads[idx].f(time, 0.9); }catch(e){}
    });
    // 시각 표시(대략적 타이밍)
    const delay = Math.max(0,(time - AC.currentTime))*1000;
    setTimeout(()=>{
      stepNodes.forEach(n=>n.classList.remove("cur"));
      stepNodes[step].classList.add("cur");
      set.forEach(idx=>{
        const el=padNodes[idx];
        if(el){ el.classList.add("seqflash"); setTimeout(()=>el.classList.remove("seqflash"),90); }
      });
    }, delay);
  }

  function startPlay(){
    ensureAudio();
    if(playing) return;
    playing=true;
    currentStep=0;
    nextStepTime = AC.currentTime + 0.05;
    loopStartTime = nextStepTime;
    schedTimer = setInterval(scheduler, INTERVAL);
    document.getElementById("btnPlay").classList.add("on");
  }
  function stopPlay(){
    playing=false;
    clearInterval(schedTimer); schedTimer=null;
    stepNodes.forEach(n=>n.classList.remove("cur"));
    document.getElementById("btnPlay").classList.remove("on");
  }

  /* ---- 버튼 핸들러 ---- */
  const btnRec=document.getElementById("btnRec");
  const btnPlay=document.getElementById("btnPlay");
  const btnClear=document.getElementById("btnClear");

  btnRec.addEventListener("click", ()=>{
    ensureAudio();
    recording=!recording;
    btnRec.classList.toggle("on", recording);
    if(recording && !playing) startPlay();
  });
  btnPlay.addEventListener("click", ()=>{
    ensureAudio();
    if(playing) stopPlay(); else startPlay();
  });
  btnClear.addEventListener("click", ()=>{
    pattern[curKit] = Array.from({length:STEPS},()=>new Set());
    // 전체 비우려면? 현재 킷만 비움. 길게가 아니라 단순화: 현재 킷 클리어.
  });

  /* ---- 슬라이더 ---- */
  const bpmInput=document.getElementById("bpm"), bpmVal=document.getElementById("bpmVal");
  bpmInput.addEventListener("input", ()=>{ bpm=parseInt(bpmInput.value,10); bpmVal.textContent=bpm; });
  const volInput=document.getElementById("vol"), volVal=document.getElementById("volVal");
  volInput.addEventListener("input", ()=>{
    volVal.textContent=volInput.value;
    if(master) master.gain.value = masterVol();
  });

  /* ---- 킷 전환 ---- */
  document.querySelectorAll(".kitbtn").forEach(b=>{
    b.addEventListener("click", ()=>{
      document.querySelectorAll(".kitbtn").forEach(x=>x.classList.remove("on"));
      b.classList.add("on");
      curKit=parseInt(b.dataset.kit,10);
      document.getElementById("kitLabel").textContent=KITS[curKit].name;
      buildPads();
    });
  });

  // 첫 상호작용에서 오디오 깨우기(모바일 자동재생 정책)
  const wake=()=>{ ensureAudio(); };
  document.body.addEventListener("pointerdown", wake, {once:true});
  document.body.addEventListener("touchstart", wake, {once:true});

})();
</script>
</body>
</html>
